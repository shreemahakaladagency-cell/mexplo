<style>
html,body{margin:0;padding:0}#hb-page,#hb-page *{box-sizing:border-box}:where(#hb-page) :where(*){margin:0;padding:0}
#hb-page{--bg:#0f0e17;--fg:#ffffff;--muted:#b9b6c8;--primary:#8b5cf6;
position:relative;display:flex;min-height:100vh;min-height:100svh;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:40px 20px;
font-family:'Inter Tight',system-ui,sans-serif;color:var(--fg);background-color:var(--bg);
background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:60px 60px}
.hb-orb{position:absolute;border-radius:50%;pointer-events:none;animation:hbOrb 12s ease-in-out infinite alternate}
.hb-orb::after{content:"";position:absolute;border-radius:50%;border:1.5px solid rgba(139,92,246,.75)}
.hb-orb-tl{width:500px;height:500px;top:-290px;left:-260px;background:radial-gradient(circle at 70% 70%,rgba(91,45,170,.25),rgba(91,45,170,.55))}
.hb-orb-tl::after{inset:-40px 80px 80px -40px}
.hb-orb-br{width:640px;height:640px;bottom:-400px;right:-320px;background:radial-gradient(circle at 30% 30%,rgba(91,45,170,.22),rgba(91,45,170,.5))}
.hb-orb-br::after{inset:50px -60px -60px 50px}
@keyframes hbOrb{0%{transform:scale(1)}100%{transform:scale(1.06)}}
.hb-particle{position:absolute;bottom:-20px;border-radius:50%;background:rgba(139,92,246,.55);box-shadow:0 0 6px rgba(139,92,246,.6);pointer-events:none;animation-name:hbRise;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes hbRise{0%{transform:translateY(0);opacity:0}10%{opacity:.9}90%{opacity:.6}100%{transform:translateY(-110vh);opacity:0}}
.hb-card{position:relative;z-index:10;width:100%;max-width:480px;padding:32px 30px 40px;text-align:center;border-radius:22px;
background:linear-gradient(180deg,rgba(28,24,44,.92),rgba(18,16,28,.92));border:1px solid rgba(139,92,246,.35);
backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 25px 70px rgba(0,0,0,.55)}
.hb-s1,.hb-s2,.hb-s3,.hb-s4{opacity:0;animation:hbUp .7s cubic-bezier(.2,.8,.2,1) forwards}
.hb-s1{animation-delay:.1s}.hb-s2{animation-delay:.25s}.hb-s3{animation-delay:.4s}.hb-s4{animation-delay:.55s}
@keyframes hbUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hb-avatar-wrap{position:relative;margin:0 auto 22px;width:176px;height:176px;display:flex;align-items:center;justify-content:center}
.hb-avatar-wrap::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(139,92,246,.7);animation:hbSpin 20s linear infinite}
@keyframes hbSpin{to{transform:rotate(360deg)}}
.hb-ring{width:158px;height:158px;border-radius:50%;padding:4px;background:linear-gradient(135deg,#a78bfa,#7c3aed);box-shadow:0 0 30px rgba(139,92,246,.55)}
.hb-ring img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #14111f}
.hb-title{font-family:'Montserrat',sans-serif;font-size:36px;line-height:1.15;font-weight:800;letter-spacing:-.02em;color:var(--fg)}
.hb-sub{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:14px}
.hb-line{height:1.5px;width:30px;flex-shrink:0;background:var(--primary)}
.hb-sub p{white-space:nowrap;font-size:13px;font-weight:600;letter-spacing:.18em;color:var(--muted)}
.hb-btn{position:relative;overflow:hidden;margin-top:38px;display:flex;width:100%;align-items:center;justify-content:center;gap:14px;border-radius:9999px;padding:20px 24px;
font-size:22px;font-weight:700;letter-spacing:-.01em;color:#fff !important;text-decoration:none !important;
background:linear-gradient(90deg,#a974fb 0%,#7c4cf0 50%,#5b33e0 100%);box-shadow:0 12px 36px rgba(124,76,240,.5);transition:transform .2s,box-shadow .2s}
.hb-btn:hover{transform:translateY(-2px);box-shadow:0 16px 46px rgba(124,76,240,.7)}
.hb-btn::after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);animation:hbShine 3.5s ease-in-out infinite}
@keyframes hbShine{0%{left:-60%}60%,100%{left:130%}}
.hb-btn svg{width:28px;height:28px;fill:currentColor}
.hb-footer{position:relative;z-index:10;margin-top:38px;font-size:15px;color:var(--muted);text-align:center}
.hb-footer a{font-weight:700;color:#fff !important;text-decoration:none !important;border-bottom:1px solid rgba(139,92,246,.8);transition:color .2s}
.hb-footer a:hover{color:#a78bfa !important}
@media(max-width:480px){.hb-title{font-size:30px}.hb-sub p{font-size:11px}.hb-btn{font-size:20px;padding:18px}.hb-card{padding:28px 22px 34px}.hb-orb-tl{width:300px;height:300px;top:-190px;left:-170px}.hb-orb-br{width:360px;height:360px;bottom:-240px;right:-200px}}
</style>
